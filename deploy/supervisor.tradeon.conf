; Tradeon production supervisor programs.
; Install: sudo cp deploy/supervisor.tradeon.conf /etc/supervisor/conf.d/tradeon.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update
; Requires: APP_ENV=production, Redis, MySQL. Never run queue as root in production.

[program:tradeon-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/tradeon/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/tradeon/storage/logs/queue-worker.log
stopwaitsecs=90
stopasgroup=true
killasgroup=true

[program:tradeon-reverb]
command=php /var/www/tradeon/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/tradeon/storage/logs/reverb.log
stopwaitsecs=30

[program:tradeon-schedule]
command=php /var/www/tradeon/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/tradeon/storage/logs/schedule.log
stopwaitsecs=30
